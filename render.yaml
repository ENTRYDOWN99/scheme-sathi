databases:
  - name: saathi-db
    databaseName: saathi
    user: saathi
    plan: free

services:
  - type: web
    name: schemesaathi-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: saathi-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

